<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兒童拼字學習機 (完整功能版) 🐝</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #40E0D0;
            --text-dark: #2C3E50;
            --bg-color: #F0F4F8;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.1);
            --font-main: 'Helvetica Neue', Arial, sans-serif;
            --color-vowel: #FF4500;
            --color-consonant: #1E90FF;
            --color-irregular: #9932CC;
        }

        body { font-family: var(--font-main); background-color: var(--bg-color); margin: 0; padding: 10px; color: var(--text-dark); text-align: center; overflow-x: hidden; }
        .app-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 25px; padding: 15px; box-shadow: var(--card-shadow); border: 4px solid var(--primary-yellow); }
        h1 { font-size: 1.4rem; margin: 8px 0; color: #E67E22; }

        /* 單元選擇器 */
        .selector-box { background-color: #E0F7FA; padding: 12px; border-radius: 15px; margin-bottom: 12px; }
        .week-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .week-label { padding: 10px 2px; background: white; border: 2px solid var(--primary-blue); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: block; }
        .week-checkbox:checked + .week-label { background: var(--primary-blue); color: white; }
        .week-checkbox { display: none; }

        /* 分頁切換 */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 12px; border-bottom: 2px solid #EEE; }
        .tab-btn { background: none; border: none; padding: 10px 2px; font-size: 0.95rem; font-weight: bold; color: #AAA; cursor: pointer; border-bottom: 4px solid transparent; flex: 1; }
        .tab-btn.active { color: var(--text-dark); border-bottom: 4px solid var(--primary-yellow); }

        /* 模式區域 */
        .mode-section { display: none; animation: fadeIn 0.3s; }
        .mode-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 單字卡片 */
        .word-card { padding: 15px 10px; background: #FFF9C4; border-radius: 20px; margin-bottom: 12px; min-height: 240px; display: flex; flex-direction: column; justify-content: center; }
        .big-word { font-size: 3.2rem; font-weight: bold; margin: 8px 0; letter-spacing: 2px; }
        @media (max-width: 400px) { .big-word { font-size: 2.6rem; } }

        .char-vowel { color: var(--color-vowel); }
        .char-consonant { color: var(--color-consonant); }
        .char-irregular { color: var(--color-irregular); font-weight: 900; }
        
        .info-text { font-size: 1.2rem; font-weight: bold; margin: 4px 0; color: #444; }
        .example-text { font-style: italic; color: #7F8C8D; margin-top: 10px; font-size: 1rem; padding: 0 10px; }
        .syllable-box { background: white; padding: 4px 12px; border-radius: 12px; border: 2px dashed #AAA; display: inline-block; margin: 4px; font-size: 1rem; color: #E67E22; }

        /* 按鈕設計 */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .action-btn { background-color: var(--primary-blue); color: white; border: none; padding: 14px 5px; font-size: 0.95rem; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #008B8B; font-weight: bold; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #008B8B; }
        .secondary-btn { background-color: #95A5A6; box-shadow: 0 4px 0 #7F8C8D; }
        .reset-btn { background-color: #F39C12; box-shadow: 0 4px 0 #D35400; }
        .check-btn { background-color: #2ECC71; box-shadow: 0 4px 0 #27AE60; }
        .challenge-btn { background-color: #E74C3C; box-shadow: 0 4px 0 #C0392B; width: 100%; grid-column: span 4; margin-top: 8px; }
        .speak-btn { background-color: #FF8C00; box-shadow: 0 4px 0 #D2691E; font-size: 1.2rem; padding: 15px; width: 70%; margin: 0 auto 10px; display: block; }

        /* 拼圖區 */
        .letter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
        .letter-block { background: white; border: 2px solid var(--primary-yellow); width: 42px; height: 42px; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .answer-area { min-height: 45px; border-bottom: 3px solid #333; margin-bottom: 12px; display: flex; justify-content: center; align-items: flex-end; gap: 4px; font-size: 2rem; font-family: monospace; }
        
        /* 聽寫區 */
        input[type="text"] { font-size: 1.6rem; padding: 10px; width: 85%; text-align: center; border: 3px solid var(--primary-blue); border-radius: 12px; outline: none; background: #FFF; margin-bottom: 5px; }
        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 10px; }
        .key { background: white; border: 1px solid #CCC; border-radius: 4px; padding: 12px 0; font-size: 0.9rem; font-weight: bold; touch-action: manipulation; }

        /* 列表區 */
        .word-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin-top: 10px; }
        .list-btn { background: white; border: 1px solid #DDD; padding: 6px; border-radius: 8px; font-size: 0.8rem; }
        .list-btn.active-word { border-color: #FF8C00; background: #FFF3E0; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🐝 拼字小蜜蜂 Pro</h1>

    <div class="selector-box">
        <div class="week-options" id="weekSelector"></div>
        <button class="action-btn challenge-btn" onclick="startWeaknessChallenge()">🔥 挑戰弱點單字</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-modeA" onclick="switchTab('modeA')">👀 學習</button>
        <button class="tab-btn" id="tab-modeB" onclick="switchTab('modeB')">🧩 拼圖</button>
        <button class="tab-btn" id="tab-modeC" onclick="switchTab('modeC')">📝 聽寫</button>
        <button class="tab-btn" id="tab-modeList" onclick="switchTab('modeList')">📋 列表</button>
    </div>

    <div id="modeA" class="mode-section active">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 單字發音</button>
            <div id="wordDisplay" class="big-word"></div>
            <div id="chineseDisplay" class="info-text"></div>
            <div id="syllableBox" class="syllable-box"></div>
            <div id="exampleDisplay" class="example-text"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️ 上一個</button>
            <div id="progressA" style="align-self:center; font-weight:bold; font-size:0.9rem;">0/0</div>
            <button class="action-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <div id="modeB" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintB" class="info-text"></div>
            <div id="puzzleAnswer" class="answer-area"></div>
            <div id="puzzlePieces" class="letter-container"></div>
            <div id="feedbackB" style="min-height:20px; font-weight:bold; margin-top:5px;"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️ 上一個</button>
            <button class="action-btn reset-btn" onclick="resetPuzzle()">🔄 重置</button>
            <button class="action-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <div id="modeC" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintC" class="info-text"></div>
            <input type="text" id="dictationInput" readonly placeholder="在此輸入...">
            <div id="feedbackC" style="min-height:20px; font-weight:bold; margin-top:5px;"></div>
            <div class="keyboard" id="keyboard"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️</button>
            <button class="action-btn reset-btn" onclick="resetDictation()">🧹 清除</button>
            <button class="action-btn" onclick="nextWord()">➡️</button>
        </div>
        <button class="action-btn check-btn" style="width:100%; margin-top:10px; font-size:1.1rem;" onclick="checkDictation()">✅ 檢查答案</button>
    </div>

    <div id="modeList" class="mode-section">
        <div class="word-card" style="background: white; min-height: 100px;">
            <button class="action-btn secondary-btn"

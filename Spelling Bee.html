<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童英文拼字學習機 (Smart Review Edition) 🐝</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #40E0D0;
            --text-dark: #2C3E50;
            --bg-color: #F7F9FC;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.1);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --color-vowel: #FF4500;
            --color-consonant: #1E90FF;
            --color-irregular: #9932CC;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            color: var(--text-dark);
            text-align: center;
            touch-action: manipulation; 
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 5px solid var(--primary-yellow);
        }

        .selector-box {
            background-color: #E0F7FA;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .week-options {
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 10px; margin-top: 10px;
        }

        .week-checkbox { display: none; }
        .week-label {
            padding: 8px 15px; background: white;
            border: 2px solid var(--primary-blue);
            border-radius: 20px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .week-checkbox:checked + .week-label {
            background: var(--primary-blue); color: white;
        }

        .tabs { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 3px solid #ddd; }
        .tab-btn {
            background: none; border: none; padding: 10px 15px;
            font-size: 1.1rem; font-weight: bold; color: #aaa;
            cursor: pointer; border-bottom: 4px solid transparent;
        }
        .tab-btn.active { color: var(--text-dark); border-bottom: 4px solid var(--primary-yellow); }

        .mode-section { display: none; animation: fadeIn 0.5s; }
        .mode-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .word-card { padding: 30px; background: #FFF9C4; border-radius: 20px; margin-bottom: 20px; position: relative; }
        .big-word { font-size: 4rem; font-weight: bold; margin: 10px 0; letter-spacing: 2px; }
        .char-vowel { color: var(--color-vowel); }
        .char-consonant { color: var(--color-consonant); }
        .char-irregular { color: var(--color-irregular); font-weight: 900; }
        .info-text { font-size: 1.5rem; margin: 10px 0; color: #555; }
        .syllable-box { background: white; padding: 5px 15px; border-radius: 20px; border: 2px dashed #aaa; display: inline-block; }

        .word-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; }
        .list-btn {
            background: white; border: 2px solid #ddd; padding: 10px; border-radius: 10px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .list-btn.active-word { border-color: #FF8C00; box-shadow: 0 0 8px rgba(255,140,0,0.5); }

        .letter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px 0; min-height: 60px; }
        .letter-block { background: white; border: 3px solid var(--primary-yellow); width: 45px; height: 45px; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }
        .answer-area { min-height: 60px; border-bottom: 4px solid #333; margin-bottom: 20px; display: flex; justify-content: center; gap: 5px; font-size: 2.5rem; font-family: monospace; }
        input[type="text"] { font-size: 2rem; padding: 10px; width: 80%; text-align: center; border: 3px solid var(--primary-blue); border-radius: 15px; outline: none; }
        
        .action-btn { background-color: var(--primary-blue); color: white; border: none; padding: 12px 24px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #008B8B; margin: 5px; }
        .challenge-btn { background-color: #E74C3C; box-shadow: 0 4px 0 #C0392B; }
        .speak-btn { background-color: #FF8C00; box-shadow: 0 4px 0 #D2691E; font-size: 1.5rem; }
        .feedback-msg { font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>

<div class="app-container">
    <h1>🐝 拼字小蜜蜂 (W1-W7)</h1>

    <div class="selector-box">
        <label>🎯 <b>選取單元進行練習：</b></label>
        <div class="week-options" id="weekSelector"></div>
        <div style="margin-top: 15px;">
            <button class="action-btn challenge-btn" onclick="startWeaknessChallenge()">🔥 弱點挑戰 (聽寫錯誤單字)</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-modeA" onclick="switchTab('modeA')">👀 學習</button>
        <button class="tab-btn" id="tab-modeList" onclick="switchTab('modeList')">📋 單字表</button>
        <button class="tab-btn" id="tab-modeB" onclick="switchTab('modeB')">🧩 拼積木</button>
        <button class="tab-btn" id="tab-modeC" onclick="switchTab('modeC')">📝 聽寫考</button>
    </div>

    <div id="modeA" class="mode-section active">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 發音</button>
            <div id="wordDisplay" class="big-word"></div>
            <div id="chineseDisplay" class="info-text"></div>
            <div id="syllableBox" class="syllable-box"></div>
        </div>
        <button class="action-btn" onclick="prevWord()">⬅️</button>
        <button class="action-btn" onclick="nextWord()">➡️</button>
    </div>

    <div id="modeList" class="mode-section">
        <div class="word-card" style="background: white;">
            <button class="action-btn" style="font-size: 0.8rem;" onclick="clearStats()">🧹 清除統計</button>
            <div id="fullWordList" class="word-list-grid"></div>
        </div>
    </div>

    <div id="modeB" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintB" class="info-text"></div>
            <div id="puzzleAnswer" class="answer-area"></div>
            <div id="puzzlePieces" class="letter-container"></div>
            <div id="feedbackB" class="feedback-msg"></div>
        </div>
        <button class="action-btn" onclick="nextWord()">下一個 ➡️</button>
    </div>

    <div id="modeC" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintC" class="info-text"></div>
            <input type="text" id="dictationInput" placeholder="請在此輸入單字..." autocomplete="off">
            <div id="feedbackC" class="feedback-msg"></div>
        </div>
        <button class="action-btn" onclick="checkDictation()">✅ 檢查</button>
        <button class="action-btn" onclick="nextWord()">➡️</button>
    </div>
</div>

        { week: "7", word: "game", syllables: ["game"], chinese: "遊戲" },
        { week: "7", word: "go out", syllables: ["go", "out"], chinese: "出去" },
        { week: "7", word: "jump onto", syllables: ["jump", "onto"], chinese: "跳上" },
        { week: "7", word: "made", syllables: ["made"], chinese: "製作(過去)" },
        { week: "7", word: "again", syllables: ["a", "gain"], chinese: "再一次" },
        { week: "7", word: "after", syllables: ["af", "ter"], chinese: "在...之後" },
        { week: "7", word: "toy", syllables: ["toy"], chinese: "玩具" },
        { week: "7", word: "brother", syllables: ["broth", "er"], chinese: "兄弟" }
    ];

    // --- 2. 核心變數與持久化 ---
    let errorStats = JSON.parse(localStorage.getItem('spellingErrors')) || {};
    let wordListOrdered = [];
    let wordListShuffled = [];
    let idxOrdered = 0;
    let idxShuffled = 0;
    let currentWordObj = null;
    let activeTab = 'modeA';
    let voices = [];
    let synth = window.speechSynthesis;
    let audioCtx = null;

    window.onload = function() {
        initWeekSelector();
        initVoiceSystem();
        initAudio();
        refreshWordData(); 
    };

    function initWeekSelector() {
        const container = document.getElementById('weekSelector');
        for (let i = 1; i <= 7; i++) {
            const div = document.createElement('div');
            div.innerHTML = `
                <input type="checkbox" class="week-checkbox" id="wk${i}" value="${i}" onchange="refreshWordData()" ${i===1?'checked':''}>
                <label for="wk${i}" class="week-label">Week ${i}</label>
            `;
            container.appendChild(div);
        }
    }

    function refreshWordData() {
        const checkedWeeks = Array.from(document.querySelectorAll('.week-checkbox:checked')).map(cb => cb.value);
        if (checkedWeeks.length === 0) {
            wordListOrdered = [];
        } else {
            // 自動排除重複
            const filteredMap = new Map();
            rawData.filter(item => checkedWeeks.includes(item.week))
                   .forEach(item => {
                       if (!filteredMap.has(item.word)) filteredMap.set(item.word, item);
                   });
            wordListOrdered = Array.from(filteredMap.values());
        }
        wordListShuffled = [...wordListOrdered].sort(() => Math.random() - 0.5);
        idxOrdered = 0;
        idxShuffled = 0;
        loadWord();
    }

    // 🔥 弱點挑戰邏輯
    function startWeaknessChallenge() {
        // 從目前的選擇清單中，找出有錯誤次數的單字
        let errorWords = wordListOrdered.filter(w => (errorStats[w.word] || 0) > 0);
        
        if (errorWords.length === 0) {
            alert("目前選擇的範圍中還沒有錯誤紀錄喔！先去練習看看吧。");
            return;
        }

        // 按錯誤次數排序 (高到低)
        errorWords.sort((a, b) => (errorStats[b.word] || 0) - (errorStats[a.word] || 0));

        // 選出前 15 個或是全部
        wordListShuffled = errorWords.slice(0, 15);
        idxShuffled = 0;
        
        switchTab('modeC'); // 自動切換到聽寫考模式
        alert(`已為您選出錯誤率最高的 ${wordListShuffled.length} 個單字，開始挑戰！`);
    }

    function recordError(word) {
        errorStats[word] = (errorStats[word] || 0) + 1;
        localStorage.setItem('spellingErrors', JSON.stringify(errorStats));
        renderWordList();
    }

    function clearStats() {
        if(confirm("確定清除所有錯誤次數？")) { 
            errorStats = {}; localStorage.removeItem('spellingErrors'); renderWordList(); 
        }
    }

    function loadWord() {
        if (wordListOrdered.length === 0) return;
        const ctx = (activeTab === 'modeA' || activeTab === 'modeList') 
            ? { list: wordListOrdered, index: idxOrdered } 
            : { list: wordListShuffled, index: idxShuffled };
        
        currentWordObj = ctx.list[ctx.index];
        if (!currentWordObj) return;

        document.getElementById('feedbackB').innerText = "";
        document.getElementById('feedbackC').innerText = "";
        document.getElementById('dictationInput').value = "";
        document.getElementById('chineseDisplay').innerText = currentWordObj.chinese;
        document.getElementById('syllableBox').innerText = currentWordObj.syllables.join(" - ");
        document.getElementById('chineseHintB').innerText = currentWordObj.chinese;
        document.getElementById('chineseHintC').innerText = currentWordObj.chinese;
        
        renderColoredWord(currentWordObj);
        initPuzzleMode(currentWordObj.word);
        renderWordList();
    }

    function renderWordList() {
        const listContainer = document.getElementById('fullWordList');
        listContainer.innerHTML = '';
        wordListOrdered.forEach((item, index) => {
            let btn = document.createElement('button');
            btn.className = 'list-btn';
            if (index === idxOrdered && (activeTab === 'modeA' || activeTab === 'modeList')) btn.classList.add('active-word');
            const errors = errorStats[item.word] || 0;
            if (errors > 0) {
                const intensity = Math.min(errors * 15, 80);
                btn.style.backgroundColor = `hsl(0, 100%, ${100 - intensity/1.5}%)`;
                if(intensity > 40) btn.style.color = "white";
            }
            btn.innerHTML = `<span>${item.word}</span><small>❌ ${errors}</small>`;
            btn.onclick = () => { activeTab = 'modeA'; idxOrdered = index; switchTab('modeA'); speakText(item.word); };
            listContainer.appendChild(btn);
        });
    }

    function checkDictation() {
        const input = document.getElementById('dictationInput').value.trim().toLowerCase();
        const correct = currentWordObj.word.toLowerCase();
        const feedback = document.getElementById('feedbackC');
        if (input === correct) {
            feedback.innerHTML = "<span class='correct'>🎉 太棒了，拼對了！</span>";
            playSound('correct'); speakText(currentWordObj.word);
        } else {
            feedback.innerHTML = `<span class='wrong'>❌ 再接再厲！正確是：${currentWordObj.word}</span>`;
            playSound('wrong'); recordError(currentWordObj.word);
        }
    }

    function switchTab(modeId) {
        activeTab = modeId;
        document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active'));
        document.getElementById(modeId).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + modeId).classList.add('active');
        loadWord();
    }

    function nextWord() {
        if (activeTab === 'modeA' || activeTab === 'modeList') idxOrdered = (idxOrdered + 1) % wordListOrdered.length;
        else idxShuffled = (idxShuffled + 1) % wordListShuffled.length;
        loadWord(); speakText(currentWordObj.word);
    }

    function prevWord() { idxOrdered = (idxOrdered - 1 + wordListOrdered.length) % wordListOrdered.length; loadWord(); }

    function speakText(text) {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US'; utter.rate = 0.8; synth.speak(utter);
    }

    function initVoiceSystem() {
        const populate = () => voices = synth.getVoices();
        speechSynthesis.onvoiceschanged = populate; populate();
    }

    function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(t) {
        if (!audioCtx) initAudio();
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(t === 'correct' ? 600 : 150, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.2);
    }

    function renderColoredWord(obj) {
        const d = document.getElementById('wordDisplay'); d.innerHTML = '';
        const vowels = 'aeiou';
        obj.word.split('').forEach((c, i) => {
            let s = document.createElement('span'); s.innerText = c;
            if (c === ' ') s.style.width = "15px";
            else if (obj.irregularIndices?.includes(i)) s.className = 'char-irregular';
            else if (vowels.includes(c.toLowerCase())) s.className = 'char-vowel';
            else s.className = 'char-consonant';
            d.appendChild(s);
        });
    }

    let puzzleCurrentAnswer = [];
    function initPuzzleMode(w) {
        const c = document.getElementById('puzzlePieces'); const a = document.getElementById('puzzleAnswer');
        c.innerHTML = ''; a.innerHTML = ''; puzzleCurrentAnswer = [];
        w.split('').sort(() => Math.random() - 0.5).forEach(char => {
            let b = document.createElement('div'); b.className = 'letter-block';
            b.innerText = char === ' ' ? '_' : char;
            b.onclick = () => {
                let s = document.createElement('span'); s.innerText = char; a.appendChild(s);
                puzzleCurrentAnswer.push(char); b.style.visibility = 'hidden';
                if (puzzleCurrentAnswer.join('') === w) { playSound('correct'); }
            };
            c.appendChild(b);
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root { --p-y: #FFD700; --p-b: #40E0D0; --t-d: #2C3E50; --bg: #F0F4F8; --v: #FF4500; --c: #1E90FF; --i: #9932CC; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--t-d); text-align: center; }
        .app-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 4px solid var(--p-y); }
        .selector-box { background: #E0F7FA; padding: 10px; border-radius: 15px; margin-bottom: 10px; }
        .week-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 5px; }
        .week-label { padding: 8px 0; background: white; border: 2px solid var(--p-b); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.8rem; display: block;}
        .week-checkbox:checked + .week-label { background: var(--p-b); color: white; }
        .week-checkbox { display: none; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 10px; border-bottom: 2px solid #EEE; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 10px 0; font-size: 0.85rem; font-weight: bold; color: #AAA; flex: 1; border-bottom: 4px solid transparent; min-width: 60px; }
        .tab-btn.active { color: var(--t-d); border-bottom: 4px solid var(--p-y); }
        .mode-section { display: none; }
        .mode-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .word-card { padding: 20px 10px; background: #FFF9C4; border-radius: 20px; margin-bottom: 10px; min-height: 250px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .big-word { font-size: 3rem; font-weight: bold; margin: 5px 0; letter-spacing: 1px; word-break: break-all; }
        .char-vowel { color: var(--v); } .char-consonant { color: var(--c); } .char-irregular { color: var(--i); font-weight: 900; }
        .info-text { font-size: 1.2rem; font-weight: bold; margin: 5px 0; }
        .syllable-box { background: white; padding: 4px 10px; border-radius: 10px; border: 1px dashed #AAA; display: inline-block; font-size: 1rem; color: #E67E22; margin-bottom: 10px; }
        .example-area { background: rgba(255,255,255,0.6); padding: 10px; border-radius: 12px; margin-top: 10px; font-size: 0.95rem; line-height: 1.4; color: #555; text-align: left; position: relative; }
        .example-btn { background: #FF8C00; border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; float: right; margin-left: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 5px; }
        .action-btn { background: var(--p-b); color: white; border: none; padding: 12px 5px; font-size: 0.9rem; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #008B8B; font-weight: bold; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #008B8B; }
        .sec-btn { background: #95A5A6; box-shadow: 0 4px 0 #7F8C8D; }
        .chk-btn { background: #2ECC71; box-shadow: 0 4px 0 #27AE60; }
        .speak-btn { background: #FF8C00; box-shadow: 0 4px 0 #D2691E; font-size: 1.2rem; width: 60%; margin: 0 auto 10px; }
        .letter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .letter-block { background: white; border: 2px solid var(--p-y); width: 40px; height: 40px; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .answer-area { min-height: 40px; border-bottom: 3px solid #333; margin-bottom: 10px; display: flex; justify-content: center; align-items: flex-end; gap: 3px; font-size: 1.8rem; font-family: monospace; }
        input[type="text"] { font-size: 1.5rem; padding: 8px; width: 85%; text-align: center; border: 2px solid var(--p-b); border-radius: 10px; outline: none; background: #fff; }
        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 10px; }
        .key { background: white; border: 1px solid #CCC; border-radius: 4px; padding: 10px 0; font-size: 0.8rem; font-weight: bold; }
        .word-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 5px; }
        .list-btn { background: white; border: 1px solid #DDD; padding: 5px; border-radius: 8px; font-size: 0.75rem; }
        .word-image { font-size: 3.2rem; line-height: 1; margin-bottom: 4px; min-height: 1.2em; }
        .word-image img { width: 72px; height: 72px; object-fit: contain; }
        .import-textarea { width:100%; height:220px; font-family: monospace; font-size: 0.78rem; padding: 10px; border-radius: 12px; border: 2px solid var(--p-b); box-sizing: border-box; resize: vertical; }
        .import-hint { font-size: 0.85rem; color: #666; text-align: left; margin-bottom: 8px; line-height: 1.4; }
        .import-preview { margin-top: 10px; font-size: 0.9rem; min-height: 24px; text-align: left; }
    </style>
</head>

<div class="app-container">
    <h1>拼字小蜜蜂 Pro 🐝</h1>
    <div class="selector-box">
        <div class="week-options" id="weekSelector"></div>
        <button class="action-btn" style="background:#E74C3C; width:100%; margin-top:8px; box-shadow:0 4px 0 #C0392B;" onclick="startWeakness()">🔥 弱點挑戰</button>
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-modeA" onclick="switchTab('modeA')">👀 學習</button>
        <button class="tab-btn" id="tab-modeB" onclick="switchTab('modeB')">🧩 拼圖</button>
        <button class="tab-btn" id="tab-modeC" onclick="switchTab('modeC')">📝 聽寫</button>
        <button class="tab-btn" id="tab-modeImport" onclick="switchTab('modeImport')">🛠️ 匯入</button>
        <button class="tab-btn" id="tab-modeList" onclick="switchTab('modeList')">📋 列表</button>
    </div>

    <div id="modeA" class="mode-section active">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakWord()">🔊 發音</button>
            <div id="wordImage" class="word-image"></div>
            <div id="wordDisplay" class="big-word"></div>
            <div id="chineseDisplay" class="info-text"></div>
            <div id="syllableBox" class="syllable-box"></div>
            <div id="exampleArea" class="example-area">
                <button class="example-btn" onclick="speakExample()">🔊</button>
                <div id="exampleText"></div>
            </div>
        </div>
        <div class="btn-group">
            <button class="action-btn sec-btn" onclick="prev()">⬅️ 上一個</button>
            <div id="progressA" style="font-weight:bold; align-self:center; font-size:0.8rem;"></div>
            <button class="action-btn" onclick="next()">下一個 ➡️</button>
        </div>
    </div>

    <div id="modeB" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakWord()">🔊 播音</button>
            <div id="chineseHintB" class="info-text"></div>
            <div id="puzzleAnswer" class="answer-area"></div>
            <div id="puzzlePieces" class="letter-container"></div>
            <div id="fbB" style="font-weight:bold; min-height:20px; font-size:1.2rem;"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn sec-btn" onclick="prev()">⬅️</button>
            <button class="action-btn sec-btn" style="background:#F39C12;" onclick="resetPuzzle()">🔄 重置</button>
            <button class="action-btn" onclick="next()">➡️</button>
        </div>
    </div>

    <div id="modeC" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakWord()">🔊 播音</button>
            <div id="chineseHintC" class="info-text"></div>
            <input type="text" id="dictationInput" readonly>
            <div id="fbC" style="font-weight:bold; min-height:20px; font-size:1.2rem;"></div>
            <div class="keyboard" id="keyboard"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn sec-btn" onclick="prev()">⬅️</button>
            <button class="action-btn sec-btn" style="background:#F39C12;" onclick="resetDict()">🧹 清除</button>
            <button class="action-btn" onclick="next()">➡️</button>
        </div>
        <button class="action-btn chk-btn" style="width:100%; margin-top:8px;" onclick="checkDict()">✅ 檢查答案</button>
    </div>

    <div id="modeImport" class="mode-section">
        <div class="word-card" style="text-align:left; min-height:auto;">
            <div class="import-hint">
                📋 直接貼上像下面這樣的 JavaScript 程式碼片段(一列或多列都可以),系統會依每筆的 <code>week</code> 欄位自動判斷:<br>
                • 如果該週已存在 → <b>整週覆蓋更新</b><br>
                • 如果該週不存在 → <b>新增一個新的 Week</b><br>
                資料會保存在這台裝置的瀏覽器中,重新整理頁面也不會消失。<br>
                💡 想加圖片的話,可以在物件裡多加一個 <code>image</code> 欄位:填 emoji(例如 <code>"🐻"</code>)或圖片網址(例如 <code>"https://.../bear.png"</code>)都可以,不加也沒關係。
            </div>
            <textarea id="importTextarea" class="import-textarea" placeholder='{ week: &quot;7&quot;, word: &quot;bride&quot;, syllables: [&quot;bride&quot;], chinese: &quot;新娘&quot;, example: &quot;A beautiful bride.&quot;, image: &quot;👰&quot; },'></textarea>
            <div id="importPreview" class="import-preview"></div>
        </div>
        <div class="btn-group" style="grid-template-columns: 1fr 1fr;">
            <button class="action-btn sec-btn" onclick="previewImport()">🔍 預覽解析</button>
            <button class="action-btn chk-btn" onclick="saveImport()">💾 更新/新增</button>
        </div>
    </div>

    <div id="modeList" class="mode-section">
        <button class="action-btn sec-btn" style="width:100%; margin-bottom:10px;" onclick="clearStats()">🧹 清除數據</button>
        <div id="fullWordList" class="word-list-grid"></div>
    </div>
</div>

// 合併內建資料與使用者匯入的自訂資料。同一個 week 若被匯入過，就整週用匯入的版本取代。
function getAllWords() {
    const overriddenWeeks = Object.keys(customData);
    const base = rawData.filter(e => !overriddenWeeks.includes(e.week));
    const custom = Object.values(customData).flat();
    return base.concat(custom);
}

function getAllWeeks() {
    const set = new Set();
    rawData.forEach(e => set.add(e.week));
    Object.keys(customData).forEach(w => set.add(w));
    return Array.from(set).sort((a, b) => parseInt(a) - parseInt(b));
}

function initWeekSelector() {
    const c = document.getElementById('weekSelector');
    const weeks = getAllWeeks();
    const prevChecked = Array.from(document.querySelectorAll('.week-checkbox:checked')).map(cb => cb.value);
    c.innerHTML = '';
    weeks.forEach(val => {
        const div = document.createElement('div');
        const display = "W" + val;
        const isChecked = prevChecked.length ? prevChecked.includes(val) : (val === '11');
        div.innerHTML = `
            <input type="checkbox" class="week-checkbox" id="wk${val}" value="${val}" onchange="refresh()" ${isChecked ? 'checked' : ''}>
            <label for="wk${val}" class="week-label">${display}</label>
        `;
        c.appendChild(div);
    });
}

function refresh() {
    const checked = Array.from(document.querySelectorAll('.week-checkbox:checked')).map(cb => cb.value);
    if (checked.length === 0) {
        wordListOrdered = [];
        currentWordObj = null;
    } else {
        const m = new Map();
        getAllWords().filter(i => checked.includes(i.week)).forEach(i => { if (!m.has(i.word)) m.set(i.word, i); });
        wordListOrdered = Array.from(m.values());
    }
    wordListShuffled = [...wordListOrdered].sort(() => Math.random() - 0.5);
    idxOrdered = 0; idxShuffled = 0;
    load();
}

function load() {
    const list = (activeTab === 'modeA' || activeTab === 'modeList') ? wordListOrdered : wordListShuffled;
    const index = (activeTab === 'modeA' || activeTab === 'modeList') ? idxOrdered : idxShuffled;
    currentWordObj = list[index];
    if (!currentWordObj) {
        clearUI();
        return;
    }
    if(activeTab==='modeA') {
        document.getElementById('progressA').innerText=`${index+1}/${list.length}`;
        document.getElementById('exampleText').innerText = currentWordObj.example || "No example provided.";
        renderWordImage();
    }
    document.getElementById('chineseDisplay').innerText=currentWordObj.chinese;
    document.getElementById('syllableBox').innerText=currentWordObj.syllables.join("-");
    document.getElementById('chineseHintB').innerText=currentWordObj.chinese;
    document.getElementById('chineseHintC').innerText=currentWordObj.chinese;
    document.getElementById('dictationInput').value="";
    ['fbB','fbC'].forEach(id => document.getElementById(id).innerText="");
    renderWord();
    initPuzzle();
    renderList();
}

function clearUI() {
    ['wordDisplay', 'chineseDisplay', 'syllableBox', 'exampleText', 'chineseHintB', 'puzzleAnswer', 'puzzlePieces', 'fbB', 'chineseHintC', 'fbC', 'progressA', 'wordImage'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.innerText = "";
    });
    if(document.getElementById('dictationInput')) document.getElementById('dictationInput').value = "";
}

// 顯示單字圖片：若 image 欄位是網址(http開頭或 data:) 就當圖片顯示，否則當成 emoji/文字直接顯示。
function renderWordImage() {
    const el = document.getElementById('wordImage');
    if (!el) return;
    const img = currentWordObj && currentWordObj.image;
    if (!img) { el.innerHTML = ""; return; }
    if (/^https?:\/\//.test(img) || img.startsWith('data:')) {
        el.innerHTML = `<img src="${img}" alt="${currentWordObj.word}">`;
    } else {
        el.innerText = img;
    }
}

function next() {
    const l = (activeTab==='modeA'||activeTab==='modeList') ? wordListOrdered : wordListShuffled;
    if(l.length === 0) return;
    if(activeTab==='modeA'||activeTab==='modeList') idxOrdered = (idxOrdered + 1) % l.length;
    else idxShuffled = (idxShuffled + 1) % l.length;
    load();
    speakWord();
}

function prev() {
    const l = (activeTab==='modeA'||activeTab==='modeList') ? wordListOrdered : wordListShuffled;
    if(l.length === 0) return;
    if(activeTab==='modeA'||activeTab==='modeList') idxOrdered = (idxOrdered - 1 + l.length) % l.length;
    else idxShuffled = (idxShuffled - 1 + l.length) % l.length;
    load();
    speakWord();
}

function switchTab(id) {
    activeTab=id;
    document.querySelectorAll('.mode-section').forEach(el=>el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('tab-'+id).classList.add('active');
    load();
}

let puzzleAns = [];
function initPuzzle() {
    if(!currentWordObj) return;
    const w=currentWordObj.word, c=document.getElementById('puzzlePieces'), a=document.getElementById('puzzleAnswer');
    c.innerHTML=''; a.innerHTML=''; puzzleAns=[];
    w.split('').sort(()=>Math.random()-0.5).forEach(char=>{
        let b=document.createElement('div'); b.className='letter-block'; b.innerText=char===' '?'＿':char;
        b.onclick=()=>{
            let s=document.createElement('span'); s.innerText=char; a.appendChild(s);
            puzzleAns.push(char); b.style.visibility='hidden';
            if(puzzleAns.length===w.length) checkPuzzle();
        };
        c.appendChild(b);
    });
}
function resetPuzzle() { initPuzzle(); }

function checkPuzzle() {
    const f=document.getElementById('fbB');
    const isCorrect = puzzleAns.join('').toLowerCase() === currentWordObj.word.toLowerCase();
    if(isCorrect) {
        f.innerHTML="<span style='color:green;'>🎉 正確！(1.5秒後跳下題)</span>";
        speakWord();
        setTimeout(() => { if(isCorrect) next(); }, 1500);
    } else {
        f.innerHTML="<span style='color:red;'>❌ 再試一次</span>";
        recordErr(currentWordObj.word);
    }
}

function initKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = "";
    "qwertyuiopasdfghjklzxcvbnm- '".split("").forEach(k=>{
        const b=document.createElement('button');
        b.className='key';
        b.innerText=k===" "?"Space":k;
        b.onclick=()=>{document.getElementById('dictationInput').value+=k;};
        kb.appendChild(b);
    });
}

function resetDict() { document.getElementById('dictationInput').value=""; }

function checkDict() {
    const i=document.getElementById('dictationInput').value.trim().toLowerCase();
    const c=currentWordObj.word.toLowerCase();
    const f=document.getElementById('fbC');
    if(i===c) {
        f.innerHTML="<span style='color:green;'>🌟 正確！(1.5秒後跳下題)</span>";
        speakWord();
        setTimeout(() => { if(i===c) next(); }, 1500);
    } else {
        f.innerHTML=`<span style='color:red;'>❌ 錯誤 (正確：${currentWordObj.word})</span>`;
        recordErr(currentWordObj.word);
    }
}

function recordErr(w) { errorStats[w]=(errorStats[w]||0)+1; localStorage.setItem('spellingErrors',JSON.stringify(errorStats)); renderList(); }
function clearStats() { if(confirm("重設紀錄？")) { errorStats={}; localStorage.removeItem('spellingErrors'); renderList(); } }

function renderList() {
    const c=document.getElementById('fullWordList'); c.innerHTML='';
    wordListOrdered.forEach((item,idx)=>{
        let b=document.createElement('button'); b.className='list-btn'+(idx===idxOrdered?' active-word':'');
        const e=errorStats[item.word]||0; if(e>0) b.style.background=`hsl(0,100%,${100-Math.min(e*20,80)/1.5}%)`;
        b.innerHTML=`<div>${item.word}</div><div style="font-size:0.6rem;">❌${e}</div>`;
        b.onclick=()=>{activeTab='modeA'; idxOrdered=idx; switchTab('modeA'); speakWord();}; c.appendChild(b);
    });
}

function renderWord() {
    const d=document.getElementById('wordDisplay'); d.innerHTML=''; const v='aeiou';
    if(!currentWordObj) return;
    currentWordObj.word.split('').forEach((c,i)=>{
        let s=document.createElement('span'); s.innerText=c;
        if(c===' ') s.style.width="12px";
        else if(currentWordObj.irregularIndices && currentWordObj.irregularIndices.includes(i)) s.className='char-irregular';
        else if(v.includes(c.toLowerCase())) s.className='char-vowel';
        else s.className='char-consonant';
        d.appendChild(s);
    });
}

function speakWord() { if(currentWordObj) playVoice(currentWordObj.word); }
function speakExample() { if(currentWordObj) playVoice(currentWordObj.example); }
function playVoice(t) { synth.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.8; synth.speak(u); }

function startWeakness() {
    let errs=wordListOrdered.filter(w=>(errorStats[w.word]||0)>0).sort((a,b)=>(errorStats[b.word]||0)-(errorStats[a.word]||0));
    if(errs.length===0) {alert("沒有錯題喔！"); return;}
    wordListShuffled=errs.slice(0,15); idxShuffled=0; switchTab('modeC');
}

// ===== 匯入 / 更新功能 =====

// 把貼上的程式碼片段解析成物件陣列。允許貼多筆、含註解列，也允許最後一筆有無逗號。
function parseImportCode(text) {
    const trimmed = text.trim();
    if (!trimmed) throw new Error("內容是空的，請先貼上程式碼。");
    const wrapped = '[' + trimmed.replace(/,\s*$/, '') + ']';
    let arr;
    try {
        arr = Function('"use strict"; return (' + wrapped + ');')();
    } catch (e) {
        throw new Error("程式碼格式錯誤，請確認貼上的內容完整、格式正確（例如大括號、引號是否成對）。詳細：" + e.message);
    }
    if (!Array.isArray(arr) || arr.length === 0) throw new Error("沒有解析到任何條目。");
    arr.forEach((item, i) => {
        if (!item || typeof item !== 'object') throw new Error(`第 ${i + 1} 筆不是有效的物件。`);
        if (!item.week) throw new Error(`第 ${i + 1} 筆缺少 week 欄位。`);
        if (!item.word) throw new Error(`第 ${i + 1} 筆缺少 word 欄位。`);
        item.week = String(item.week);
        if (!item.syllables) item.syllables = [item.word];
        if (!item.chinese) item.chinese = "";
        if (!item.example) item.example = "";
    });
    return arr;
}

function groupByWeek(arr) {
    const grouped = {};
    arr.forEach(item => {
        if (!grouped[item.week]) grouped[item.week] = [];
        grouped[item.week].push(item);
    });
    return grouped;
}

function previewImport() {
    const p = document.getElementById('importPreview');
    try {
        const arr = parseImportCode(document.getElementById('importTextarea').value);
        const grouped = groupByWeek(arr);
        const summary = Object.keys(grouped).sort((a,b)=>parseInt(a)-parseInt(b))
            .map(w => `Week ${w}：${grouped[w].length} 個單字${customData[w] || rawData.some(e=>e.week===w) ? '（將覆蓋整週）' : '（新增新週）'}`)
            .join('<br>');
        p.innerHTML = `<span style="color:green;">✅ 解析成功：</span><br>${summary}`;
    } catch (e) {
        p.innerHTML = `<span style="color:red;">❌ ${e.message}</span>`;
    }
}

function saveImport() {
    const p = document.getElementById('importPreview');
    try {
        const arr = parseImportCode(document.getElementById('importTextarea').value);
        const grouped = groupByWeek(arr);
        Object.keys(grouped).forEach(w => { customData[w] = grouped[w]; });
        localStorage.setItem('customWordData', JSON.stringify(customData));
        const summary = Object.keys(grouped).sort((a,b)=>parseInt(a)-parseInt(b))
            .map(w => `Week ${w}（${grouped[w].length} 個）`).join('、');
        p.innerHTML = `<span style="color:green;">🎉 已更新：${summary}</span>`;
        document.getElementById('importTextarea').value = "";
        initWeekSelector();
        refresh();
    } catch (e) {
        p.innerHTML = `<span style="color:red;">❌ ${e.message}</span>`;
    }
}

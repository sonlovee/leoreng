<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兒童拼字學習機 (Mobile Pro) 🐝</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #40E0D0;
            --text-dark: #2C3E50;
            --bg-color: #F0F4F8;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.1);
            --font-main: 'Helvetica Neue', Arial, sans-serif;
            --color-vowel: #FF4500;
            --color-consonant: #1E90FF;
            --color-irregular: #9932CC;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            margin: 0; padding: 10px;
            color: var(--text-dark);
            text-align: center;
            overflow-x: hidden;
        }

        /* 行動端容器優化 */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            border: 4px solid var(--primary-yellow);
        }

        h1 { font-size: 1.5rem; margin: 10px 0; color: #E67E22; }

        /* 單元選擇器優化 */
        .selector-box {
            background-color: #E0F7FA;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .week-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .week-label {
            padding: 10px 5px;
            background: white;
            border: 2px solid var(--primary-blue);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: block;
        }
        .week-checkbox:checked + .week-label {
            background: var(--primary-blue);
            color: white;
        }
        .week-checkbox { display: none; }

        /* 分頁切換優化 */
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            border-bottom: 2px solid #EEE;
        }
        .tab-btn {
            background: none; border: none; padding: 10px 5px;
            font-size: 1rem; font-weight: bold; color: #AAA;
            cursor: pointer; border-bottom: 4px solid transparent;
            flex: 1;
        }
        .tab-btn.active { color: var(--text-dark); border-bottom: 4px solid var(--primary-yellow); }

        /* 卡片設計 */
        .mode-section { display: none; animation: fadeIn 0.3s; }
        .mode-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .word-card { 
            padding: 20px 10px; 
            background: #FFF9C4; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* 單字縮放 */
        .big-word { 
            font-size: 3.5rem; 
            font-weight: bold; 
            margin: 10px 0; 
            letter-spacing: 2px;
            word-wrap: break-word;
        }
        @media (max-width: 400px) { .big-word { font-size: 2.8rem; } }

        .char-vowel { color: var(--color-vowel); }
        .char-consonant { color: var(--color-consonant); }
        .char-irregular { color: var(--color-irregular); }
        
        .info-text { font-size: 1.3rem; font-weight: bold; margin: 5px 0; color: #444; }
        .syllable-box { background: white; padding: 5px 12px; border-radius: 15px; border: 2px dashed #AAA; display: inline-block; margin: 5px; font-size: 1.1rem; }

        /* 按鈕群組 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .full-btn-group {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn { 
            background-color: var(--primary-blue); color: white; border: none; 
            padding: 15px 5px; font-size: 1rem; border-radius: 15px; 
            cursor: pointer; box-shadow: 0 4px 0 #008B8B; font-weight: bold;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #008B8B; }
        .secondary-btn { background-color: #95A5A6; box-shadow: 0 4px 0 #7F8C8D; }
        .challenge-btn { background-color: #E74C3C; box-shadow: 0 4px 0 #C0392B; width: 100%; grid-column: span 4; margin-top: 10px; }
        .speak-btn { background-color: #FF8C00; box-shadow: 0 4px 0 #D2691E; font-size: 1.4rem; padding: 20px; width: 80%; margin: 0 auto 15px; }

        /* 積木與聽寫 */
        .letter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .letter-block { background: white; border: 3px solid var(--primary-yellow); width: 45px; height: 45px; font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .answer-area { min-height: 50px; border-bottom: 3px solid #333; margin-bottom: 15px; display: flex; justify-content: center; align-items: flex-end; gap: 4px; font-size: 2.2rem; font-family: monospace; }
        
        input[type="text"] { font-size: 1.8rem; padding: 12px; width: 90%; text-align: center; border: 3px solid var(--primary-blue); border-radius: 15px; outline: none; margin-bottom: 10px; }

        /* 虛擬鍵盤 */
        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
        .key { background: white; border: 1px solid #CCC; border-radius: 5px; padding: 12px 0; font-size: 1rem; font-weight: bold; cursor: pointer; }

        /* 單字列表 */
        .word-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 15px; }
        .list-btn { background: white; border: 2px solid #DDD; padding: 8px; border-radius: 10px; font-size: 0.9rem; }
        .list-btn.active-word { border-color: #FF8C00; background: #FFF3E0; }
    </style>
</head>

<div class="app-container">
    <h1>🐝 拼字小蜜蜂 Pro</h1>

    <div class="selector-box">
        <div class="week-options" id="weekSelector"></div>
        <button class="action-btn challenge-btn" onclick="startWeaknessChallenge()">🔥 挑戰弱點單字</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-modeA" onclick="switchTab('modeA')">👀 學習</button>
        <button class="tab-btn" id="tab-modeB" onclick="switchTab('modeB')">🧩 拼圖</button>
        <button class="tab-btn" id="tab-modeC" onclick="switchTab('modeC')">📝 聽寫</button>
        <button class="tab-btn" id="tab-modeList" onclick="switchTab('modeList')">📋 列表</button>
    </div>

    <div id="modeA" class="mode-section active">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 點我發音</button>
            <div id="wordDisplay" class="big-word"></div>
            <div id="chineseDisplay" class="info-text"></div>
            <div id="syllableBox" class="syllable-box"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️ 上一個</button>
            <div id="progressA" style="align-self:center; font-weight:bold;">0/0</div>
            <button class="action-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <div id="modeB" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintB" class="info-text"></div>
            <div id="puzzleAnswer" class="answer-area"></div>
            <div id="puzzlePieces" class="letter-container"></div>
            <div id="feedbackB" class="feedback-msg" style="min-height:24px; font-weight:bold;"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️ 上一個</button>
            <button class="action-btn secondary-btn" onclick="resetPuzzle()">🔄 重置</button>
            <button class="action-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <div id="modeC" class="mode-section">
        <div class="word-card">
            <button class="action-btn speak-btn" onclick="speakText(currentWordObj.word)">🔊 播音</button>
            <div id="chineseHintC" class="info-text"></div>
            <input type="text" id="dictationInput" placeholder="在此輸入..." autocomplete="off" readonly onclick="focusInput()">
            <div id="feedbackC" class="feedback-msg" style="min-height:24px; font-weight:bold;"></div>
            <div class="keyboard" id="keyboard"></div>
        </div>
        <div class="full-btn-group">
            <button class="action-btn secondary-btn" onclick="prevWord()">⬅️</button>
            <button class="action-btn" style="background:#2ECC71;" onclick="checkDictation()">✅ 檢查答案</button>
            <button class="action-btn" onclick="nextWord()">➡️</button>
        </div>
        <button class="action-btn secondary-btn" style="width:100%; margin-top:10px;" onclick="resetDictation()">🧹 清除文字</button>
    </div>

    <div id="modeList" class="mode-section">
        <div class="word-card" style="background: white;">
            <button class="action-btn secondary-btn" style="padding:10px;" onclick="clearStats()">🧹 清除統計數據</button>
            <div id="fullWordList" class="word-list-grid"></div>
        </div>
    </div>
</div>

        { week: "7", word: "am", syllables: ["am"], chinese: "是" },
        { week: "7", word: "and", syllables: ["and"], chinese: "和" },
        { week: "7", word: "fan", syllables: ["fan"], chinese: "風扇" },
        { week: "7", word: "had", syllables: ["had"], chinese: "有(過去式)" },
        { week: "7", word: "but", syllables: ["but"], chinese: "但是" },
        { week: "7", word: "game", syllables: ["game"], chinese: "遊戲" },
        { week: "7", word: "go out", syllables: ["go", "out"], chinese: "出去" },
        { week: "7", word: "jump onto", syllables: ["jump", "onto"], chinese: "跳上" },
        { week: "7", word: "made", syllables: ["made"], chinese: "製造(過去式)" },
        { week: "7", word: "again", syllables: ["again"], chinese: "再一次" },
        { week: "7", word: "after", syllables: ["after"], chinese: "在...以後" },

        { week: "7", word: "brother", syllables: ["brother"], chinese: "兄弟" }
    ];

    // --- 核心邏輯 ---
    let errorStats = JSON.parse(localStorage.getItem('spellingErrors')) || {};
    let wordListOrdered = [];
    let wordListShuffled = [];
    let idxOrdered = 0;
    let idxShuffled = 0;
    let currentWordObj = null;
    let activeTab = 'modeA';
    let synth = window.speechSynthesis;

    window.onload = function() {
        initWeekSelector();
        initKeyboard();
        refreshWordData();
    };

    function initWeekSelector() {
        const container = document.getElementById('weekSelector');
        for (let i = 1; i <= 7; i++) {
            const div = document.createElement('div');
            div.innerHTML = `
                <input type="checkbox" class="week-checkbox" id="wk${i}" value="${i}" onchange="refreshWordData()" ${i===1?'checked':''}>
                <label for="wk${i}" class="week-label">W${i}</label>
            `;
            container.appendChild(div);
        }
    }

    function refreshWordData() {
        const checkedWeeks = Array.from(document.querySelectorAll('.week-checkbox:checked')).map(cb => cb.value);
        if (checkedWeeks.length === 0) {
            wordListOrdered = [];
        } else {
            const filteredMap = new Map();
            rawData.filter(item => checkedWeeks.includes(item.week))
                   .forEach(item => {
                       if (!filteredMap.has(item.word)) filteredMap.set(item.word, item);
                   });
            wordListOrdered = Array.from(filteredMap.values());
        }
        wordListShuffled = [...wordListOrdered].sort(() => Math.random() - 0.5);
        idxOrdered = 0;
        idxShuffled = 0;
        loadWord();
    }

    function loadWord() {
        const list = (activeTab === 'modeA' || activeTab === 'modeList') ? wordListOrdered : wordListShuffled;
        const index = (activeTab === 'modeA' || activeTab === 'modeList') ? idxOrdered : idxShuffled;
        
        currentWordObj = list[index];
        if (!currentWordObj) return;

        // 更新 UI
        if(activeTab === 'modeA') document.getElementById('progressA').innerText = `${index + 1} / ${list.length}`;
        
        document.getElementById('chineseDisplay').innerText = currentWordObj.chinese;
        document.getElementById('syllableBox').innerText = currentWordObj.syllables.join(" - ");
        document.getElementById('chineseHintB').innerText = currentWordObj.chinese;
        document.getElementById('chineseHintC').innerText = currentWordObj.chinese;
        document.getElementById('feedbackB').innerText = "";
        document.getElementById('feedbackC').innerText = "";
        document.getElementById('dictationInput').value = "";

        renderColoredWord();
        initPuzzleMode();
        renderWordList();
    }

    function nextWord() {
        const list = (activeTab === 'modeA' || activeTab === 'modeList') ? wordListOrdered : wordListShuffled;
        if (activeTab === 'modeA' || activeTab === 'modeList') idxOrdered = (idxOrdered + 1) % list.length;
        else idxShuffled = (idxShuffled + 1) % list.length;
        loadWord();
        speakText(currentWordObj.word);
    }

    function prevWord() {
        const list = (activeTab === 'modeA' || activeTab === 'modeList') ? wordListOrdered : wordListShuffled;
        if (activeTab === 'modeA' || activeTab === 'modeList') idxOrdered = (idxOrdered - 1 + list.length) % list.length;
        else idxShuffled = (idxShuffled - 1 + list.length) % list.length;
        loadWord();
        speakText(currentWordObj.word);
    }

    function switchTab(modeId) {
        activeTab = modeId;
        document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active'));
        document.getElementById(modeId).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + modeId).classList.add('active');
        loadWord();
    }

    // --- 拼圖邏輯 ---
    let puzzleCurrentAnswer = [];
    function initPuzzleMode() {
        const word = currentWordObj.word;
        const container = document.getElementById('puzzlePieces');
        const answerArea = document.getElementById('puzzleAnswer');
        container.innerHTML = ''; answerArea.innerHTML = '';
        puzzleCurrentAnswer = [];
        
        word.split('').sort(() => Math.random() - 0.5).forEach(char => {
            let b = document.createElement('div');
            b.className = 'letter-block';
            b.innerText = char === ' ' ? '＿' : char;
            b.onclick = () => {
                let s = document.createElement('span');
                s.innerText = char;
                answerArea.appendChild(s);
                puzzleCurrentAnswer.push(char);
                b.style.visibility = 'hidden';
                if (puzzleCurrentAnswer.length === word.length) checkPuzzle();
            };
            container.appendChild(b);
        });
    }
    function resetPuzzle() { initPuzzleMode(); }
    function checkPuzzle() {
        const isCorrect = puzzleCurrentAnswer.join('') === currentWordObj.word;
        const fb = document.getElementById('feedbackB');
        if (isCorrect) {
            fb.innerHTML = "<span style='color:green;'>🎉 答對了！</span>";
            speakText(currentWordObj.word);
        } else {
            fb.innerHTML = "<span style='color:red;'>❌ 再試一次</span>";
            recordError(currentWordObj.word);
        }
    }

    // --- 聽寫鍵盤邏輯 ---
    function initKeyboard() {
        const keys = "qwertyuiopasdfghjklzxcvbnm- ".split("");
        const kb = document.getElementById('keyboard');
        keys.forEach(k => {
            const btn = document.createElement('button');
            btn.className = 'key';
            btn.innerText = k === " " ? "Space" : k;
            btn.onclick = () => { document.getElementById('dictationInput').value += k; };
            kb.appendChild(btn);
        });
    }
    function resetDictation() { document.getElementById('dictationInput').value = ""; }
    function checkDictation() {
        const input = document.getElementById('dictationInput').value.trim().toLowerCase();
        const correct = currentWordObj.word.toLowerCase();
        const fb = document.getElementById('feedbackC');
        if (input === correct) {
            fb.innerHTML = "<span style='color:green;'>🌟 正確！</span>";
            speakText(currentWordObj.word);
        } else {
            fb.innerHTML = `<span style='color:red;'>❌ 錯誤 (正確：${currentWordObj.word})</span>`;
            recordError(currentWordObj.word);
        }
    }

    // --- 其他功能 ---
    function recordError(word) {
        errorStats[word] = (errorStats[word] || 0) + 1;
        localStorage.setItem('spellingErrors', JSON.stringify(errorStats));
        renderWordList();
    }
    function clearStats() {
        if(confirm("重設紀錄？")) { errorStats = {}; localStorage.removeItem('spellingErrors'); renderWordList(); }
    }
    function renderWordList() {
        const listContainer = document.getElementById('fullWordList');
        listContainer.innerHTML = '';
        wordListOrdered.forEach((item, index) => {
            let btn = document.createElement('button');
            btn.className = 'list-btn' + (index === idxOrdered ? ' active-word' : '');
            const err = errorStats[item.word] || 0;
            if (err > 0) {
                const intensity = Math.min(err * 20, 85);
                btn.style.backgroundColor = `hsl(0, 100%, ${100 - intensity/1.5}%)`;
            }
            btn.innerHTML = `<div>${item.word}</div><div style="font-size:0.7rem;">❌${err}</div>`;
            btn.onclick = () => { activeTab = 'modeA'; idxOrdered = index; switchTab('modeA'); speakText(item.word); };
            listContainer.appendChild(btn);
        });
    }
    function renderColoredWord() {
        const d = document.getElementById('wordDisplay'); d.innerHTML = '';
        const vowels = 'aeiou';
        currentWordObj.word.split('').forEach((c, i) => {
            let s = document.createElement('span'); s.innerText = c;
            if (c === ' ') s.style.width = "15px";
            else if (currentWordObj.irregularIndices?.includes(i)) s.className = 'char-irregular';
            else if (vowels.includes(c.toLowerCase())) s.className = 'char-vowel';
            else s.className = 'char-consonant';
            d.appendChild(s);
        });
    }
    function speakText(t) { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.8; synth.speak(u); }
    function startWeaknessChallenge() {
        let errWords = wordListOrdered.filter(w => (errorStats[w.word] || 0) > 0);
        if (errWords.length === 0) { alert("沒有錯題喔！"); return; }
        errWords.sort((a,b) => (errorStats[b.word]||0) - (errorStats[a.word]||0));
        wordListShuffled = errWords.slice(0, 15);
        idxShuffled = 0; switchTab('modeC');
    }
</script>
